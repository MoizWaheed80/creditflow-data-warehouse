# Windows Authentication to the named instance localhost\SQLEXPRESS.
# username/password are left as empty strings on purpose - dlt's mssql
# destination expects these fields to resolve to *something*, and with
# Windows auth there's no actual username/password to give it.
#
# port = 1433 is a guess (SQL Server's usual default). Named instances often
# listen on a different, dynamically assigned port. If the pipeline can't
# reach the server, check SQL Server Configuration Manager -> SQL Server
# Network Configuration -> Protocols for SQLEXPRESS -> TCP/IP -> IP Addresses
# tab -> IPAll -> TCP Dynamic Ports, and put that number here instead.

[destination.mssql.credentials]
database = "creditflow-data-warehouse"
username = ""
password = ""
host = 'localhost\SQLEXPRESS'
port = 1433
driver = "ODBC Driver 18 for SQL Server"
connect_timeout = 15

[destination.mssql.credentials.query]
trusted_connection = "yes"
encrypt = "no"
